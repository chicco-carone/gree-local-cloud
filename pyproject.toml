[project]
name = "gree-local-cloud"
version = "0.2.0"
description = "Local Gree U-WB04BRT13 cloud replacement with Home Assistant MQTT Discovery"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.4,<3",
    "dnslib>=0.9.26",
    "pycryptodome>=3.23",
]

[project.scripts]
gree-local = "gree_local.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gree_local"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "tools", "research"]
